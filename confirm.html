<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Post — Confirm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:#fff;border-radius:16px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.icon{font-size:48px;margin-bottom:20px}
h1{font-size:21px;font-weight:700;color:#1c1c1e;margin-bottom:12px}
p{font-size:15px;color:#6c6c70;line-height:1.6;margin-bottom:28px}
button{background:#34c759;color:#fff;border:none;border-radius:12px;padding:14px 0;font-size:17px;font-weight:600;cursor:pointer;width:100%;margin-bottom:12px}
button.decline{background:#ff3b30}
.brand{font-size:13px;color:#aeaeb2;margin-top:20px}
.loading{display:none;font-size:15px;color:#6c6c70;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">✉️</div>
  <h1 id="title">Confirm your notification preference</h1>
  <p id="message">Click below to confirm you're happy to be notified via Last Post.</p>
  <!-- Hidden form — submitted programmatically so the browser handles redirects natively (no CORS issues) -->
  <form id="theForm" method="POST" action="">
    <input type="hidden" id="tokenInput" name="token" value="">
    <input type="hidden" id="actionInput" name="action" value="accept">
    <button id="btn-accept" type="submit">Yes, notify me</button>
  </form>
  <form id="declineForm" method="POST" action="" style="display:none">
    <input type="hidden" name="token" value="">
    <input type="hidden" name="action" value="decline">
    <button class="decline" type="submit">Yes, remove me</button>
  </form>
  <p class="brand">Last Post</p>
</div>

<script>
const SUPABASE_URL = 'https://kypzbbupzuaukdkjeghu.supabase.co'

const params = new URLSearchParams(window.location.search)
const token  = params.get('token') || ''
const action = (params.get('action') || 'accept').toLowerCase()
const type   = (params.get('type') || 'contact').toLowerCase()

const endpoint = type === 'designated'
  ? `${SUPABASE_URL}/functions/v1/accept-designated-invitation?token=${encodeURIComponent(token)}&action=${encodeURIComponent(action)}`
  : `${SUPABASE_URL}/functions/v1/accept-contact-invitation?token=${encodeURIComponent(token)}&action=${encodeURIComponent(action)}`

// Wire up forms
document.getElementById('theForm').action = endpoint
document.getElementById('tokenInput').value = token
document.getElementById('actionInput').value = action

document.getElementById('declineForm').action = endpoint.replace('action=accept','action=decline')
document.querySelectorAll('#declineForm input[name="token"]').forEach(i => i.value = token)

// Customise UI based on type and action
if (type === 'designated') {
  document.querySelector('.icon').textContent = '🤝'
  document.querySelector('h1').textContent = 'Accept your role as Designated Person'
  document.querySelector('p').textContent = "Click below to confirm you're happy to help notify loved ones when the time comes."
  document.getElementById('btn-accept').textContent = '✓ Accept invitation'
} else if (action === 'decline') {
  document.querySelector('.icon').textContent = '👋'
  document.querySelector('h1').textContent = 'Remove me from this list'
  document.querySelector('p').textContent = "Click below to confirm you'd like to be removed from the notification list."
  document.getElementById('theForm').style.display = 'none'
  document.getElementById('declineForm').style.display = 'block'
}
</script>
</body>
</html>

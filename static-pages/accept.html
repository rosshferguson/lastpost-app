<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Post — Contact Invitation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f2f2f7;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 60px;
    color: #1c1c1e;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    border: 1px solid #e5e5ea;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }

  .logo {
    font-size: 36px;
    text-align: center;
    margin-bottom: 8px;
  }

  .brand {
    font-size: 13px;
    font-weight: 600;
    color: #aeaeb2;
    text-align: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 15px;
    color: #636366;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .info-box {
    background: #f9f9f9;
    border: 1px solid #e5e5ea;
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 28px;
    font-size: 15px;
    color: #3c3c43;
    line-height: 1.6;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-accept  { background: #1c7ed6; color: #fff; }
  .btn-decline { background: #f2f2f7; color: #636366; font-size: 15px; font-weight: 500; }

  .result {
    display: none;
    text-align: center;
    padding: 24px 0 8px;
  }
  .result .icon { font-size: 48px; margin-bottom: 12px; }
  .result h2   { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .result p    { font-size: 15px; color: #636366; line-height: 1.5; }

  .spinner {
    display: none;
    text-align: center;
    padding: 16px 0;
    color: #636366;
    font-size: 15px;
  }

  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: #aeaeb2;
  }
  .footer a { color: #aeaeb2; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">✉️</div>
  <div class="brand">Last Post</div>

  <!-- Initial state -->
  <div id="initial">
    <h1>You've been added as a contact</h1>
    <p class="subtitle">Someone has added you to their Last Post notification list. If they pass away, you'll be notified by the app.</p>

    <div class="info-box" id="info-box">
      Loading invitation details…
    </div>

    <button class="btn btn-accept" id="btn-accept" onclick="respond('accept')">Accept — add me to the list</button>
    <button class="btn btn-decline" id="btn-decline" onclick="respond('decline')">Decline — remove me</button>
  </div>

  <!-- Spinner -->
  <div class="spinner" id="spinner">Processing…</div>

  <!-- Result -->
  <div class="result" id="result">
    <div class="icon" id="result-icon"></div>
    <h2 id="result-title"></h2>
    <p id="result-body"></p>
  </div>

  <div class="footer">
    <a href="https://lastpost.app/privacy.html">Privacy Policy</a> &bull; <a href="https://lastpost.app">lastpost.app</a>
  </div>
</div>

<script>
const EDGE = 'https://kypzbbupzuaukdkjeghu.supabase.co/functions/v1/accept-contact-invitation';

const params = new URLSearchParams(window.location.search);
const token  = params.get('token');

// Populate info box if name is embedded in the URL (optional enhancement)
const fromName = params.get('from');
const infoBox  = document.getElementById('info-box');
if (fromName) {
  infoBox.innerHTML = `<strong>${decodeURIComponent(fromName)}</strong> has added you to their Last Post contact list. If they pass away, you will be notified by email or text message.`;
} else {
  infoBox.innerHTML = 'Someone has added you to their Last Post contact list. If they pass away, you will be notified by email or text message.';
}

if (!token) {
  showResult('❌', 'Invalid link', 'This invitation link is missing required information. Please ask to be re-invited.');
}

async function respond(action) {
  if (!token) return;

  document.getElementById('initial').style.display  = 'none';
  document.getElementById('spinner').style.display  = 'block';

  try {
    const res = await fetch(`${EDGE}?token=${encodeURIComponent(token)}&action=${action}`);
    const text = await res.text();

    document.getElementById('spinner').style.display = 'none';

    if (action === 'accept') {
      showResult('✅', 'You\'re on the list', 'Thanks for confirming. You will be notified by Last Post when the time comes.');
    } else {
      showResult('👋', 'Invitation declined', 'You have been removed from the notification list. If you change your mind, ask to be re-invited.');
    }
  } catch (err) {
    document.getElementById('spinner').style.display = 'none';
    showResult('⚠️', 'Something went wrong', 'Please try again or contact support at lastposthelp@gmail.com');
  }
}

function showResult(icon, title, body) {
  document.getElementById('initial').style.display  = 'none';
  document.getElementById('spinner').style.display  = 'none';
  document.getElementById('result').style.display   = 'block';
  document.getElementById('result-icon').textContent  = icon;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-body').textContent  = body;
}
</script>
</body>
</html>
